[project]
name = "sae-bilingual"
version = "0.1.0"
description = "Sparse autoencoders on a bilingual JA-EN LLM (llm-jp-3-1.8B)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "torch",
  "transformers",
  "datasets",
  "numpy",
  "scipy",
  "matplotlib",
  "huggingface_hub",
  "sae-lens",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
